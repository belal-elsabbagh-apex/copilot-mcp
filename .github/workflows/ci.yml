name: CI

# Runs on every PR and on pushes to main: typecheck, lint, build, and test.
# The tag-driven publish/release workflows only typecheck+build, so this is the
# gate that actually exercises lint and the test suite before code merges.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # Needed to resolve the private @belal-elsabbagh-apex scope.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      # The published bin is executed by MCP hosts under *node* via npx, never bun,
      # so bun-only CI never exercised the shipped artifact. Pinned to the
      # engines.node floor (24) because that is the version that can actually break.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Smoke-test the built bundle under node
        run: |
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 node dist/server.js)
          echo "$out" | head -c 400
          echo "$out" | grep -q '"serverInfo"'
